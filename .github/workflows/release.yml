name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, zip, and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build and package plugin zip
        run: ./deploy.sh dist

      - name: Verify zips exist
        run: |
          test -f dist/simple-lms-bridge.zip
          test -f dist/simple-lms-migrator.zip

      - name: Create GitHub Release and attach zips
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/simple-lms-bridge.zip
            dist/simple-lms-migrator.zip
          generate_release_notes: true
